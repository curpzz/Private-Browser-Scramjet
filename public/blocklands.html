<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Blocklands</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87bde8;font-family:system-ui, sans-serif;color:white}#game{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}#brand,#help{background:#101820bb;border:1px solid #ffffff30;border-radius:10px;padding:9px 12px;text-shadow:0 2px 3px #000}#brand{font-weight:900;letter-spacing:.08em}#brand small{display:block;font-size:10px;opacity:.7;font-weight:500;letter-spacing:0}#help{font-size:11px;max-width:330px;text-align:right;line-height:1.45}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}#cross:before,#cross:after{content:"";position:absolute;background:white;box-shadow:0 1px 3px #000;width:2px;height:18px;left:8px}#cross:after{transform:rotate(90deg)}
#hotbar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:6px;background:#101820b8;border:1px solid #ffffff50;border-radius:11px;max-width:96vw} .slot{width:48px;height:48px;border:2px solid #ffffff50;border-radius:7px;background:#263747dd;display:grid;place-items:center;font-size:24px;position:relative}.slot.active{border:3px solid white;background:#ffffff38;transform:translateY(-4px)}.slot small{position:absolute;right:4px;bottom:1px;font-size:9px;color:#fff}
#menu{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#10182099,#101820bb);padding:18px}#panel{width:min(440px,100%);padding:25px;border:1px solid #ffffff45;border-radius:18px;background:#111a24ee;box-shadow:0 18px 60px #0008;text-align:center}h1{margin:0 0 7px;font-size:34px;letter-spacing:-.05em}#panel p{color:#c7d3df;font-size:13px;line-height:1.5}button{font:inherit;cursor:pointer}#start,#resume{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(135deg,#b6ef8a,#58bd84);color:#102117;font-weight:900;margin-top:10px}#newworld{width:100%;padding:11px;border:1px solid #ffffff45;border-radius:10px;background:#27394a;color:white;margin-top:8px}#status{font-size:11px;color:#a9bacb;margin-top:12px}
#mobile{display:none;position:absolute;inset:0;pointer-events:none}#stick{position:absolute;left:18px;bottom:88px;width:116px;height:116px;border-radius:50%;background:#10182055;border:2px solid #ffffff55;pointer-events:auto;touch-action:none}#nub{position:absolute;left:34px;top:34px;width:44px;height:44px;border-radius:50%;background:#ffffff99;border:2px solid white}#actions{position:absolute;right:16px;bottom:90px;display:grid;grid-template-columns:58px 58px;gap:9px;pointer-events:auto}#actions button{height:55px;border:1px solid #ffffff88;border-radius:13px;background:#10182099;color:white;font-size:11px;font-weight:800;touch-action:none}#actions button:active{background:#ffffff55}#lookhint{position:absolute;right:15px;top:85px;font-size:10px;color:white;text-shadow:0 1px 3px black}
@media(max-width:700px){#mobile{display:block}#help{display:none}.slot{width:40px;height:42px;font-size:20px}#hotbar{bottom:12px}.slot small{font-size:8px}}
</style></head><body>
<div id="game"></div><div id="top"><div id="brand">BLOCKLANDS <small>EARLY ACCESS · CREATIVE SANDBOX</small></div><div id="help">WASD move · Space jump · Mouse look<br>Left click break · Right click place · 1–6 select<br>Esc pause</div></div><div id="cross"></div>
<div id="hotbar"></div>
<div id="mobile"><div id="stick"><div id="nub"></div></div><div id="lookhint">Drag to look</div><div id="actions"><button id="break">BREAK</button><button id="place">PLACE</button><button id="jump">JUMP</button><button id="pause">PAUSE</button></div></div>
<div id="menu"><div id="panel"><h1>Blocklands</h1><p>A little block world you can explore, shape, and build in. Your world saves on this device.</p><button id="start">ENTER WORLD</button><button id="newworld">CREATE NEW WORLD</button><div id="status">Loading 3D world…</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const host=document.querySelector('#game'), menu=document.querySelector('#menu'), status=document.querySelector('#status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x86bde8);scene.fog=new THREE.Fog(0x86bde8,25,62);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);camera.position.set(8,12,8);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9efff,0x6e684b,2));const sun=new THREE.DirectionalLight(0xfff2d6,2.2);sun.position.set(-18,30,12);scene.add(sun);
const mats={grass:new THREE.MeshLambertMaterial({color:0x68a94b}),dirt:new THREE.MeshLambertMaterial({color:0x805333}),stone:new THREE.MeshLambertMaterial({color:0x858b91}),sand:new THREE.MeshLambertMaterial({color:0xd8c17a}),wood:new THREE.MeshLambertMaterial({color:0x956338}),leaves:new THREE.MeshLambertMaterial({color:0x397c43}),brick:new THREE.MeshLambertMaterial({color:0xa94e3e})};
const types=Object.keys(mats),icons=['🟩','🟫','🪨','🟨','🪵','🌿','🧱'];let selected=0;
const key=(x,y,z)=>x+','+y+','+z, blocks=new Map(), meshes=[], ray=new THREE.Raycaster();const cube=new THREE.BoxGeometry(1,1,1);
function put(x,y,z,t){if(y<0||y>40)return;blocks.set(key(x,y,z),t)}
function height(x,z){return Math.floor(3+Math.sin(x*.23)*1.3+Math.cos(z*.19)*1.2+Math.sin((x+z)*.13)*.8)}
function tree(x,z){const y=height(x,z);for(let i=1;i<=3;i++)put(x,y+i,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=2;dy<=4;dy++)if(Math.abs(dx)+Math.abs(dz)+(dy===4?1:0)<5)put(x+dx,y+dy,z+dz,'leaves')}
function generate(){blocks.clear();for(let x=-16;x<16;x++)for(let z=-16;z<16;z++){let h=height(x,z);for(let y=0;y<=h;y++)put(x,y,z,y===h?(h<3?'sand':'grass'):y>h-3?'dirt':'stone');if(((x*13+z*7+400)%37===0)&&Math.abs(x)>3&&Math.abs(z)>3)tree(x,z)}}
function rebuild(){for(const m of meshes){scene.remove(m);m.geometry.dispose()}meshes.length=0;const groups={};for(const t of types)groups[t]=[];for(const [k,t] of blocks){const p=k.split(',').map(Number);groups[t].push(p)}for(const t of types){const ps=groups[t];if(!ps.length)continue;const im=new THREE.InstancedMesh(cube,mats[t],ps.length);const obj=new THREE.Object3D();ps.forEach((p,i)=>{obj.position.set(p[0],p[1],p[2]);obj.updateMatrix();im.setMatrixAt(i,obj.matrix)});im.instanceMatrix.needsUpdate=true;im.userData.positions=ps;im.userData.type=t;scene.add(im);meshes.push(im)}}
function save(){try{localStorage.setItem('blocklands-world-v1',JSON.stringify([...blocks]))}catch(e){status.textContent='Storage full: world could not be saved.'}}
function load(){try{const data=JSON.parse(localStorage.getItem('blocklands-world-v1')||'null');if(Array.isArray(data)){blocks.clear();for(const [k,t] of data)if(types.includes(t))blocks.set(k,t);return true}}catch(e){}return false}
if(!load())generate();rebuild();status.textContent='World ready · 32 × 32 blocks';
const slots=document.querySelector('#hotbar');function hotbar(){slots.innerHTML='';types.forEach((t,i)=>{const b=document.createElement('div');b.className='slot'+(i===selected?' active':'');b.innerHTML=icons[i]+'<small>'+(i+1)+'</small>';b.onclick=()=>select(i);slots.append(b)})}function select(i){selected=(i+types.length)%types.length;hotbar()}hotbar();
const player={x:8.5,y:height(8,8)+1.01,z:8.5,vy:0,onGround:false};let yaw=Math.PI*.25,pitch=-.2,playing=false;
function solidAt(x,y,z){return blocks.has(key(Math.floor(x),Math.floor(y),Math.floor(z)))}
function collides(x,y,z){for(let dx of [-.23,.23])for(let dz of [-.23,.23])for(let dy of [0,.85,1.65])if(solidAt(x+dx,y+dy,z+dz))return true;return false}
function start(){playing=true;menu.style.display='none';if(innerWidth>700&&renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock();renderer.domElement.focus()}
function pause(){playing=false;menu.style.display='grid';if(document.pointerLockElement)document.exitPointerLock();document.querySelector('#start').textContent='RESUME WORLD'}
document.querySelector('#start').onclick=start;document.querySelector('#newworld').onclick=()=>{generate();player.x=8.5;player.z=8.5;player.y=height(8,8)+1.01;rebuild();save();status.textContent='Fresh world created · saved locally'};
document.querySelector('#pause').onclick=pause;
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===renderer.domElement)playing=true;else if(playing&&innerWidth>700)pause()});
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(/^Digit[1-7]$/.test(e.code))select(Number(e.code.slice(5))-1);if(e.code==='Escape'&&playing)pause()});addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('click',()=>{if(innerWidth>700&&!playing)start()});
addEventListener('contextmenu',e=>e.preventDefault());
function targetBlock(){ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(meshes,false);return hits.length&&hits[0].distance<6?hits[0]:null}
function edit(place){const hit=targetBlock();if(!hit)return;const mesh=hit.object,idx=hit.instanceId,p=mesh.userData.positions[idx];if(place){const n=hit.face.normal;const x=p[0]+Math.round(n.x),y=p[1]+Math.round(n.y),z=p[2]+Math.round(n.z);if(!blocks.has(key(x,y,z))&&!(Math.abs(x-player.x)<.8&&Math.abs(z-player.z)<.8&&y>=player.y&&y<=player.y+1.8)){put(x,y,z,types[selected])}}else blocks.delete(key(...p));rebuild();save()}
renderer.domElement.addEventListener('mousedown',e=>{if(!playing)return;if(e.button===0)edit(false);if(e.button===2)edit(true)});
addEventListener('mousemove',e=>{if(!playing||innerWidth<=700||document.pointerLockElement!==renderer.domElement)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.48,Math.min(1.48,pitch-e.movementY*.0022))});
let joy={x:0,y:0},lookTouch=null;const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');
function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),scale=Math.min(1,45/(len||1));joy.x=dx*scale/45;joy.y=dy*scale/45;nub.style.transform='translate('+dx*scale+'px,'+dy*scale+'px)'}
stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))stickMove(e)});stick.addEventListener('pointerup',()=>{joy={x:0,y:0};nub.style.transform=''});
renderer.domElement.addEventListener('pointerdown',e=>{if(innerWidth>700||e.target.closest('button')||e.target===stick)return;lookTouch={x:e.clientX,y:e.clientY,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!lookTouch||e.pointerId!==lookTouch.id)return;const dx=e.clientX-lookTouch.x,dy=e.clientY-lookTouch.y;lookTouch={x:e.clientX,y:e.clientY,id:e.pointerId};yaw-=dx*.006;pitch=Math.max(-1.48,Math.min(1.48,pitch-dy*.006))});
renderer.domElement.addEventListener('pointerup',e=>{if(lookTouch&&e.pointerId===lookTouch.id)lookTouch=null});
document.querySelector('#break').onclick=()=>edit(false);document.querySelector('#place').onclick=()=>edit(true);document.querySelector('#jump').onclick=()=>{if(player.onGround)player.vy=7};
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,(now-last)/1000);last=now;if(playing){const forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y;const side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;const len=Math.hypot(forward,side)||1;const speed=keys.ShiftLeft?7:4.5;const dx=(Math.sin(yaw)*forward+Math.cos(yaw)*side)/len*speed*dt,dz=(Math.cos(yaw)*forward-Math.sin(yaw)*side)/len*speed*dt;if(!collides(player.x+dx,player.y,player.z))player.x+=dx;if(!collides(player.x,player.y,player.z+dz))player.z+=dz;if((keys.Space||keys.KeyE)&&player.onGround)player.vy=7;player.vy-=18*dt;let ny=player.y+player.vy*dt;if(collides(player.x,ny,player.z)){if(player.vy<0)player.onGround=true;player.vy=0}else{player.y=ny;player.onGround=false}if(player.y< -8){player.x=8.5;player.z=8.5;player.y=height(8,8)+2;player.vy=0}camera.position.set(player.x,player.y+1.55,player.z);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}renderer.render(scene,camera)}
requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.35))});
</script></body></html>
