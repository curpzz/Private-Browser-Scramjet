<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b14">
  <meta name="description" content="ZUX OS — private family browser">
  <title>ZUX OS — Browser</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <script src="/register-sw.js?v=20261030-3" defer></script>
  <script src="/app.js?v=20261030-3" defer></script>
</head>
<body>
  <main class="shell">
    <section id="login" class="panel">
      <div class="brand-row">
        <div class="mark">Z</div>
        <div><p class="brand-name">ZUX OS</p><p class="brand-subtitle">PRIVATE BROWSER</p></div>
      </div>
      <div class="login-copy">
        <p class="eyebrow">FAMILY ACCESS</p>
        <h1>Welcome back.</h1>
        <p class="muted">Enter your access code to open your private browsing session.</p>
      </div>
      <form id="login-form">
        <label for="pin">VERIFICATION</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="128" placeholder="Enter access code" required>
        <button type="submit">Continue <span aria-hidden="true">→</span></button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
      <p class="footnote">Private session · Access protected</p>
    </section>
    <section id="browser" class="browser hidden">
      <header>
        <div class="brand-row compact">
          <div class="mark">Z</div>
          <div><p class="brand-name">ZUX OS</p><p class="brand-subtitle">BROWSER</p></div>
        </div>
        <button id="lock" class="secondary" type="button">Lock session</button>
      </header>
      <form id="browse-form" class="address-row">
        <span class="address-icon" aria-hidden="true">⌕</span>
        <input id="address" type="text" placeholder="Search or enter a website address" autocomplete="url" required>
        <button type="submit">Go <span aria-hidden="true">→</span></button>
      </form>
      <p id="status" class="muted" aria-live="polite">Your secure session is ready.</p>
      <div id="frame-host"></div>
    </section>
  </main>
</body>
</html>
